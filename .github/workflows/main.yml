name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Find project
        run: |
          shopt -s nullglob
          for z in *.zip; do unzip -oq "$z" -d unzipped_"${z%.zip}"; done
          DIR=$(find . -name 'settings.gradle*' -not -path '*/.git/*' | head -1 | xargs -r dirname)
          if [ -z "$DIR" ]; then
            echo "لم أجد settings.gradle في المستودع. الملفات الموجودة:"
            find . -maxdepth 3 -not -path './.git*' | head -50
            exit 1
          fi
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew && ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
