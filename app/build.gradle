plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def gdxVersion = '1.12.1'

android {
    namespace 'com.elephant.action3d'
    compileSdk 34

    defaultConfig {
        applicationId 'com.elephant.action3d'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

configurations {
    natives
}

dependencies {
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"

    testImplementation 'junit:junit:4.13.2'
}

tasks.register('copyAndroidNatives') {
    doFirst {
        def abis = ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64']
        abis.each { abi -> file("libs/$abi").mkdirs() }
        configurations.natives.copy().files.each { jar ->
            abis.each { abi ->
                if (jar.name.endsWith("natives-${abi}.jar")) {
                    project.copy {
                        from project.zipTree(jar)
                        into file("libs/$abi")
                        include '*.so'
                    }
                }
            }
        }
    }
}

tasks.matching { it.name.contains('JniLibFolders') }.configureEach {
    dependsOn 'copyAndroidNatives'
}
